<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">

        </ul>

    <main>
        <section id="about">
            <article>
                <h2>Про мене</h2>

            </article>
        </section>

        <section id="skills">
            <article>

        <section id="projects">

    <div id="modal" class="modal">

            <button id="close-modal">Закрити</button>
            <form id="contact-form">
                <input type="text" id="user-name" placeholder="Ваше ім'я">
                <button type="submit">Надіслати</button>
            </form>
        </div>

    <script src="script.js"></script>
